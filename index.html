<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Page</title>
<style>
:root{--accent:#7ec8f5;--bg1:#0b1b3a;--bg2:#1c3d73}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;font-family:system-ui,sans-serif;color:#fff;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed}
#bg{position:fixed;inset:0;background-size:cover;background-position:center;opacity:.55;z-index:0}
main{position:relative;z-index:1;width:100%;max-width:420px;padding:48px 20px;text-align:center}
.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);background:#234}
h1{margin:14px 0 6px;font-size:28px}
.bio p{margin:4px 0;opacity:.85}
.links{display:flex;flex-direction:column;gap:14px;margin-top:28px}
a.link{display:block;padding:16px;border:2px solid var(--accent);border-radius:14px;color:#fff;text-decoration:none;font-weight:600;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);transition:.2s}
a.link:hover{transform:translateY(-2px);background:rgba(255,255,255,.22)}
.player{margin-top:28px;padding:14px;border:2px solid var(--accent);border-radius:14px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px)}
.row{display:flex;align-items:center;gap:12px}
#play{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#0b1b3a;font-size:18px;cursor:pointer}
#title{flex:1;text-align:left;font-weight:600;font-size:14px}
#vol{width:80px;accent-color:var(--accent)}
canvas{width:100%;height:70px;margin-top:10px;display:block}
</style>
</head>
<body>
<div id="bg"></div>
<main>
  <img class="avatar" id="avatar" alt="">
  <h1 id="name"></h1>
  <div class="bio" id="bio"></div>
  <div class="links" id="links"></div>
  <div class="player" id="playerBox">
    <div class="row">
      <button id="play" aria-label="play">▶</button>
      <div id="title"></div>
      <input id="vol" type="range" min="0" max="1" step="0.01" value="0.7">
    </div>
    <canvas id="viz"></canvas>
  </div>
</main>
<audio id="audio" loop preload="none"></audio>
<script>
// ====== এখানে সব customize করো ======
const CONFIG = {
  name: "ShanZo",
  bio: ["~ Video Editor", "~ After Effects"],
  avatar: "daed2e88-3517-4500-8f6a-83b663add15f(1).jpg",         // যেমন "avatar.jpg" (same folder এ রাখো)
  background: "c9e97a4e957a492887bbe496b2f5fd24.jpg",     // যেমন "bg.jpg"; খালি রাখলে gradient
  accent: "#7ec8f5",  // theme color
  music: "paparazzi.mp3", // গানের ফাইলের নাম; music না চাইলে "" দাও
  musicTitle: "Paparazzi",
  links: [
    { label: "Free Project Files", url: "https://drive.google.com" },
    { label: "YouTube",            url: "https://youtube.com" },
    { label: "Discord",            url: "https://discord.com" },
    { label: "Instagram",          url: "https://instagram.com" }
  ]
};
// ====================================
const $ = id => document.getElementById(id);
document.title = CONFIG.name;
document.documentElement.style.setProperty("--accent", CONFIG.accent);
$("name").textContent = CONFIG.name;
CONFIG.avatar ? $("avatar").src = CONFIG.avatar : $("avatar").style.display = "none";
if (CONFIG.background) $("bg").style.backgroundImage = `url('${CONFIG.background}')`;
CONFIG.bio.forEach(t => { const p = document.createElement("p"); p.textContent = t; $("bio").appendChild(p); });
CONFIG.links.forEach(l => {
  const a = document.createElement("a");
  a.className = "link"; a.href = l.url; a.target = "_blank"; a.rel = "noopener";
  a.textContent = l.label; $("links").appendChild(a);
});

// ---- Music + Visualizer ----
if (!CONFIG.music) { $("playerBox").style.display = "none"; }
else {
  const audio = $("audio"), cv = $("viz"), ctx = cv.getContext("2d");
  audio.src = CONFIG.music; audio.volume = 0.7;
  $("title").textContent = "♪ " + CONFIG.musicTitle;
  let ac, an, data, started = false;
  function setup() {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createMediaElementSource(audio);
    an = ac.createAnalyser(); an.fftSize = 128;
    src.connect(an); an.connect(ac.destination);
    data = new Uint8Array(an.frequencyBinCount);
    started = true;
  }
  function draw() {
    requestAnimationFrame(draw);
    const w = cv.width = cv.clientWidth * devicePixelRatio, h = cv.height = cv.clientHeight * devicePixelRatio;
    ctx.clearRect(0, 0, w, h);
    if (!started) return;
    an.getByteFrequencyData(data);
    const n = 40, bw = w / n;
    ctx.fillStyle = CONFIG.accent;
    for (let i = 0; i < n; i++) {
      const v = data[Math.floor(i * data.length / n)] / 255;
      const bh = Math.max(3, v * h);
      ctx.fillRect(i * bw + 2, h - bh, bw - 4, bh);
    }
  }
  draw();
  $("play").onclick = () => {
    if (!started) setup();
    if (ac.state === "suspended") ac.resume();
    if (audio.paused) { audio.play(); $("play").textContent = "❚❚"; }
    else { audio.pause(); $("play").textContent = "▶"; }
  };
  $("vol").oninput = e => audio.volume = e.target.value;
}
</script>
</body>
</html>
