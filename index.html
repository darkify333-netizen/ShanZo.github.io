<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Page</title>
<style>
:root{--accent:#7ec8f5;--bg1:#0b1b3a;--bg2:#1c3d73}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;font-family:system-ui,sans-serif;color:#fff;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed}
#bg{position:fixed;inset:-24px;background-size:cover;background-position:center;z-index:0}
#snow{position:fixed;inset:0;pointer-events:none;z-index:5}
main{--rx:0px;--ra:0;position:relative;z-index:1;width:100%;max-width:420px;padding:48px 20px;text-align:center;text-shadow:var(--rx) 0 rgba(255,0,60,var(--ra)),calc(var(--rx)*-1) 0 rgba(0,210,255,var(--ra))}
a.link,.player,.avatar{box-shadow:var(--rx) 0 0 rgba(255,0,60,calc(var(--ra)*.7)),calc(var(--rx)*-1) 0 0 rgba(0,210,255,calc(var(--ra)*.7))}
.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);background:#234}
h1{margin:14px 0 6px;font-size:28px}
.bio p{margin:4px 0;opacity:.85}
.links{display:flex;flex-direction:column;gap:14px;margin-top:28px}
a.link{position:relative;display:flex;align-items:center;justify-content:center;padding:18px 62px;border:2px solid var(--accent);border-radius:14px;color:#fff;text-decoration:none;font-weight:600;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);transition:.2s}
a.link:hover{transform:translateY(-2px);background:rgba(255,255,255,.22)}
a.link svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);width:34px;height:34px}
.player{position:relative;margin-top:28px;padding:18px 16px 14px;border:2px solid var(--accent);border-radius:14px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px)}
.disc{position:relative;width:140px;height:140px;flex:none;cursor:pointer}
.disc img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;background:#234}
.cd{position:absolute;inset:-2px;border-radius:50%;border:2px solid rgba(255,255,255,.7);
background:repeating-radial-gradient(circle,rgba(255,255,255,.05) 0 2px,rgba(0,0,0,.05) 2px 4px),conic-gradient(rgba(255,255,255,0),rgba(255,255,255,.28),rgba(255,255,255,0),rgba(126,200,245,.25),rgba(255,255,255,0),rgba(255,255,255,.28),rgba(255,255,255,0));
-webkit-mask:radial-gradient(circle,transparent 9%,#000 10%);mask:radial-gradient(circle,transparent 9%,#000 10%);
animation:spin 5s linear infinite;animation-play-state:paused}
.playing .cd{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.pbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:15px}
.playing .pbtn{opacity:0}
.top{display:flex;justify-content:center;align-items:center;gap:22px}.sp{width:24px;flex:none}
.vol{position:relative;flex:none;width:24px;height:110px;touch-action:none;cursor:pointer}
.vt{position:absolute;left:9px;top:0;bottom:0;width:6px;border-radius:3px;background:#fff}
.vth{position:absolute;left:2px;top:0;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:16px solid #fff}
canvas#viz{width:100%;height:52px;margin-top:10px;display:block}
#seek{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:2px 0 0}
#seek::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#fff}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;margin-top:-6px;box-shadow:0 0 6px rgba(0,0,0,.4)}
#seek::-moz-range-track{height:6px;border-radius:3px;background:#fff}
#seek::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff}
#title{margin-top:2px;font-weight:700;letter-spacing:4px;text-transform:uppercase;font-size:15px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="tri" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".2126 .7152 .0722 0 0 .2126 .7152 .0722 0 0 .2126 .7152 .0722 0 0 0 0 0 1 0"/><feComponentTransfer><feFuncR id="fr" type="table" tableValues="0 .5 1"/><feFuncG id="fg" type="table" tableValues="0 .5 1"/><feFuncB id="fb" type="table" tableValues="0 .5 1"/></feComponentTransfer></filter></svg>
<div id="bg"></div>
<canvas id="snow"></canvas>
<main>
  <img class="avatar" id="avatar" alt="">
  <h1 id="name"></h1>
  <div class="bio" id="bio"></div>
  <div class="links" id="links"></div>
  <div class="player" id="playerBox">
    <div class="top">
      <div class="sp"></div>
      <div class="disc" id="disc">
        <img id="cover" alt="">
        <div class="cd"></div>
        <div class="pbtn">▶</div>
      </div>
      <div class="vol" id="vol"><div class="vt"></div><div class="vth" id="vth"></div></div>
    </div>
    <canvas id="viz"></canvas>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <div id="title"></div>
  </div>
</main>
<audio id="audio" loop preload="metadata"></audio>
<script>
// ====== এখানে সব customize করো ======
const CONFIG = {
  name: "ShanZo",
  bio: ["~ Video Editor", "~ After Effects"],
  avatar: "daed2e88-3517-4500-8f6a-83b663add15f(1).jpg",
  background: "c9e97a4e957a492887bbe496b2f5fd24.jpg",
  accent: "#c17ef5",
  music: "paparazzi.mp3",
  musicTitle: "Paparazzi",   // গানের নাম (Spot 5)
  musicCover: "daed2e88-3517-4500-8f6a-83b663add15f(1).jpg", // গানের ছবি; খালি রাখলে avatar আসবে
  snow: true,                // snowfall চালু/বন্ধ
  bgBlur: 3,                 // background blur (px)
  bgOpacity: 0.9,            // background এর উজ্জ্বলতা (0 থেকে 1)
  shake: true,               // beat এ shake + RGB displace
  links: [
    { label: "Free Project Files", url: "https://discord.gg/vAS76FG2h6" },
    { label: "YouTube",            url: "https://youtube.com/@shanzo_nv?si=-FbifbBYkK4-UtdM" },
    { label: "Discord",            url: "https://discord.gg/vAS76FG2h6" },
    { label: "Instagram",          url: "https://www.instagram.com/shanzo_nv?stkn=dGF2eWZ1aGRvampo" }
  ]
};
// ====================================
const $ = id => document.getElementById(id);
const W = (inner, a = 'fill="currentColor"') => `<svg viewBox="0 0 24 24" ${a}>${inner}</svg>`;
const S = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const ICONS = {
  youtube: W('<path fill-rule="evenodd" d="M4 5h16a3 3 0 013 3v8a3 3 0 01-3 3H4a3 3 0 01-3-3V8a3 3 0 013-3zm6 4v6l5-3z"/>'),
  discord: W('<path fill-rule="evenodd" d="M5 5.5L9 4.4l.5.9Q12 5 14.5 5.3l.5-.9 4 1.100Q22 10 21.500 16l-4 1.500-.7-1.300Q12 18 7.200 16.200L6.500 17.500 2.500 16Q2 10 5 5.500zM9.500 13.500a1.600 1.800 0 100-3.600 1.600 1.800 0 000 3.600zm5 0a1.600 1.800 0 100-3.600 1.600 1.800 0 000 3.600z"/>'),
  instagram: W('<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.500" cy="6.500" r=".6"/>', S),
  drive: W('<path d="M8 3h8l6 10-4 7H6l-4-7z"/><path d="M8 3l10 17M16 3L6 20M2 13h20"/>', S),
  tiktok: W('<path d="M14 3v11.500a3.500 3.500 0 11-3.500-3.500M14 3c.3 2.500 2 4.300 5 4.500"/>', S),
  x: W('<path d="M4 4l16 16M20 4L4 20"/>', S),
  telegram: W('<path d="M21.500 3.500L2.500 11l5.500 2 2 6 3-3.500 5 3.700z"/>'),
  facebook: W('<path d="M15 3h-2.500A3.500 3.500 0 009 6.500V21M6 11h9"/>', S),
  link: W('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>', S)
};
function iconFor(url) {
  let h = ""; try { h = new URL(url).hostname.toLowerCase(); } catch (e) {}
  if (/youtube|youtu\.be/.test(h)) return ICONS.youtube;
  if (/discord/.test(h)) return ICONS.discord;
  if (/instagram/.test(h)) return ICONS.instagram;
  if (/drive\.google|docs\.google/.test(h)) return ICONS.drive;
  if (/tiktok/.test(h)) return ICONS.tiktok;
  if (/twitter|(^|\.)x\.com/.test(h)) return ICONS.x;
  if (/t\.me|telegram/.test(h)) return ICONS.telegram;
  if (/facebook|fb\.com/.test(h)) return ICONS.facebook;
  return ICONS.link;
}
document.title = CONFIG.name;
document.documentElement.style.setProperty("--accent", CONFIG.accent);
$("name").textContent = CONFIG.name;
CONFIG.avatar ? $("avatar").src = CONFIG.avatar : $("avatar").style.display = "none";
if (CONFIG.background) {
  const bg = $("bg"), hx = (CONFIG.accent || "#7ec8f5").replace("#", "");
  const R = parseInt(hx.slice(0, 2), 16) / 255, G = parseInt(hx.slice(2, 4), 16) / 255, B = parseInt(hx.slice(4, 6), 16) / 255;
  const mx = Math.max(R, G, B), mn = Math.min(R, G, B), d = mx - mn;
  let h = 0; if (d) { h = mx === R ? ((G - B) / d) % 6 : mx === G ? (B - R) / d + 2 : (R - G) / d + 4; h *= 60; if (h < 0) h += 360; }
  // tritone: shadow = black, highlight = white, midtone = HSB(accent hue, 45, 50)
  const sat = .45, br = .5, f = n => { const k = (n + h / 60) % 6; return br - br * sat * Math.max(0, Math.min(k, 4 - k, 1)); };
  [["fr", 5], ["fg", 3], ["fb", 1]].forEach(([id, n]) => $(id).setAttribute("tableValues", `0 ${f(n).toFixed(3)} 1`));
  bg.style.backgroundImage = `url("${CONFIG.background}")`;
  bg.style.filter = `url(#tri) blur(${CONFIG.bgBlur}px)`;
  bg.style.opacity = CONFIG.bgOpacity;
}
CONFIG.bio.forEach(t => { const p = document.createElement("p"); p.textContent = t; $("bio").appendChild(p); });
CONFIG.links.forEach(l => {
  const a = document.createElement("a");
  a.className = "link"; a.href = l.url; a.target = "_blank"; a.rel = "noopener";
  a.innerHTML = iconFor(l.url) + "<span></span>";
  a.querySelector("span").textContent = l.label; $("links").appendChild(a);
});

// ---- Snow ----
if (CONFIG.snow) {
  const sc = $("snow"), sx = sc.getContext("2d"), P = [];
  const rs = () => { sc.width = innerWidth; sc.height = innerHeight; };
  rs(); addEventListener("resize", rs);
  for (let i = 0; i < 70; i++) P.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: 1 + Math.random() * 2.5, s: .3 + Math.random() * .8, d: Math.random() * 6.28 });
  (function snow() {
    requestAnimationFrame(snow);
    sx.clearRect(0, 0, sc.width, sc.height); sx.fillStyle = "rgba(255,255,255,.85)";
    P.forEach(p => {
      p.y += p.s; p.d += .01; p.x += Math.sin(p.d) * .4;
      if (p.y > sc.height + 5) { p.y = -5; p.x = Math.random() * sc.width; }
      sx.beginPath(); sx.arc(p.x, p.y, p.r, 0, 6.28); sx.fill();
    });
  })();
} else $("snow").style.display = "none";

// ---- Music ----
if (!CONFIG.music) { $("playerBox").style.display = "none"; }
else {
  const audio = $("audio"), cv = $("viz"), ctx = cv.getContext("2d"), box = $("playerBox"), seek = $("seek"), vol = $("vol");
  audio.src = CONFIG.music;
  $("title").textContent = CONFIG.musicTitle;
  $("cover").onerror = () => { if (CONFIG.avatar && !$("cover").src.endsWith(encodeURI(CONFIG.avatar))) $("cover").src = CONFIG.avatar; };
  $("cover").src = CONFIG.musicCover || CONFIG.avatar;
  let ac, an, data, binHz = 43, started = false;
  function setup() {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createMediaElementSource(audio);
    an = ac.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = .6; an.minDecibels = -85; an.maxDecibels = -25;
    src.connect(an); an.connect(ac.destination);
    data = new Uint8Array(an.frequencyBinCount); binHz = ac.sampleRate / an.fftSize; started = true;
  }
  const NB = 14, prev = new Array(NB).fill(0); let peak = .5;
  function bands() {
    const playing = started && !audio.paused, xs = [];
    for (let k = 0; k < NB; k++) {
      let x = 0;
      if (playing) {
        const lo = Math.max(1, Math.floor(60 * Math.pow(8000 / 60, k / NB) / binHz));
        const hi = Math.max(lo + 1, Math.floor(60 * Math.pow(8000 / 60, (k + 1) / NB) / binHz));
        let t = 0; for (let b = lo; b < hi; b++) t += data[b];
        x = Math.pow(t / (hi - lo) / 255 * (1 + k * .05), 1.8);
      }
      xs.push(x);
    }
    peak = Math.max(peak * .997, .45, ...xs);
    for (let k = 0; k < NB; k++) {
      const v = xs[k] / peak;
      prev[k] = v > prev[k] ? v * .7 + prev[k] * .3 : prev[k] * .78 + v * .22;
    }
  }
  const mainEl = document.querySelector("main"), bgEl = $("bg"), rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let avg = 0, last = 0, inten = 0;
  function fx() {
    if (CONFIG.shake && !rm && started && !audio.paused) {
      let t = 0, cn = 0; for (let b = Math.max(1, Math.round(40 / binHz)); b <= Math.round(160 / binHz); b++) { t += data[b]; cn++; }
      const e = t / cn, now = performance.now();
      if (e > 90 && e > avg + 22 && now - last > 230) { inten = 1; last = now; }
      avg = avg * .95 + e * .05;
    }
    inten *= .86;
    if (inten < .02) {
      if (inten !== 0) { inten = 0; mainEl.style.transform = bgEl.style.transform = ""; mainEl.style.setProperty("--ra", 0); mainEl.style.setProperty("--rx", "0px"); }
      return;
    }
    const a = inten * 5, dx = (Math.random() - .5) * 2 * a, dy = (Math.random() - .5) * 2 * a;
    mainEl.style.transform = bgEl.style.transform = `translate(${dx}px,${dy}px)`;
    mainEl.style.setProperty("--rx", (inten * 4) + "px"); mainEl.style.setProperty("--ra", .85);
  }
  function draw() {
    requestAnimationFrame(draw);
    const w = cv.width = cv.clientWidth * devicePixelRatio, h = cv.height = cv.clientHeight * devicePixelRatio;
    ctx.clearRect(0, 0, w, h);
    const n = 27, c = (n - 1) / 2, step = w / n, mid = h / 2;
    if (started && !audio.paused) an.getByteFrequencyData(data);
    fx(); bands();
    ctx.lineCap = "round"; ctx.lineWidth = step * .5; ctx.strokeStyle = "rgba(255,255,255,.88)";
    for (let i = 0; i < n; i++) {
      const bh = Math.max(ctx.lineWidth * 1.6, prev[Math.min(NB - 1, Math.round(Math.abs(i - c)))] * h * .95);
      const x = i * step + step / 2;
      ctx.beginPath(); ctx.moveTo(x, mid - bh / 2 + ctx.lineWidth / 2); ctx.lineTo(x, mid + bh / 2 - ctx.lineWidth / 2); ctx.stroke();
    }
  }
  draw();
  $("disc").onclick = () => {
    if (!started) setup();
    if (ac.state === "suspended") ac.resume();
    if (audio.paused) { audio.play(); box.classList.add("playing"); }
    else { audio.pause(); box.classList.remove("playing"); }
  };
  // timeline
  audio.ontimeupdate = () => { if (audio.duration && !seeking) seek.value = audio.currentTime / audio.duration * 1000; };
  let seeking = false;
  seek.oninput = () => { seeking = true; if (audio.duration) audio.currentTime = seek.value / 1000 * audio.duration; };
  seek.onchange = () => seeking = false;
  seek.addEventListener("pointerup", () => seeking = false);
  // volume (vertical, triangle)
  function setVol(x) {
    x = Math.min(1, Math.max(0, x)); audio.volume = x;
    $("vth").style.top = ((1 - x) * (vol.clientHeight - 16)) + "px";
  }
  const fromY = e => { const r = vol.getBoundingClientRect(); setVol(1 - (e.clientY - r.top - 8) / (r.height - 16)); };
  vol.addEventListener("pointerdown", e => { vol.setPointerCapture(e.pointerId); fromY(e); vol.onpointermove = fromY; });
  vol.addEventListener("pointerup", () => vol.onpointermove = null);
  setVol(.7);
}
</script>
</body>
</html>
